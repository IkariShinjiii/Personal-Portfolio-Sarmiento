<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kervin Sarmiento, full-stack web developer in Iloilo City. Web apps, desktop apps like Gabay, and an AI concierge that answers questions about my work." />
    <meta name="theme-color" content="#0c0d10" />
    <meta property="og:title" content="Kervin Sarmiento - Full-stack web developer" />
    <meta property="og:description" content="I build web apps and desktop apps like Gabay, and I'm studying at USA." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://personal-portfolio-sarmiento.vercel.app/profile.jpg" />
    <title>Kervin Sarmiento - Portfolio</title>
    <script src="/theme-init.js"></script>
    <script src="/preload-init.js"></script>
    <style>
      /* Intro screen (see public/preloader.js). Hidden unless preload-init.js adds html.preloading. */
      .preloader { display: none; }
      html.preloading { overflow: hidden; }
      html.preloading .preloader {
        display: block; position: fixed; inset: 0; z-index: 100; overflow: hidden;
        background: var(--bg); color: var(--text);
        transition: transform 1s cubic-bezier(1, 0.01, 0.38, 1.01); will-change: transform;
      }
      .preloader.leaving { transform: translateY(-105%); }
      .pl-text { position: absolute; left: 0; right: 0; top: 48%; transform: translateY(-50%); z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 16px; text-align: center; }
      .pl-name { margin: 0; display: flex; justify-content: center; font: 800 clamp(64px, 20vw, 220px) / 1 var(--font-sans, Inter, system-ui, sans-serif); letter-spacing: -0.05em; }
      .pl-ch { display: inline-block; animation: pl-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: calc(var(--i) * 50ms + 100ms); }
      @keyframes pl-in {
        from { opacity: 0.001; filter: blur(10px); transform: translateX(200px) scale(3) skewY(3deg); }
        to { opacity: 1; filter: blur(0); transform: none; }
      }
      .pl-slogan { position: relative; width: 100%; height: 1.4em; font: 500 16px / 1.2 var(--font-mono, "JetBrains Mono", ui-monospace, monospace); letter-spacing: -0.04em; color: var(--muted); }
      .pl-line { position: absolute; inset: 0; margin: 0; white-space: nowrap; }
      .pl-sc { display: inline-block; white-space: pre; opacity: 0; transform: translateY(40px); transition: transform 0.2s ease-out, opacity 0.2s ease-out; transition-delay: calc(var(--i) * 10ms); }
      .pl-line.on .pl-sc { opacity: 1; transform: none; }
      .pl-line.out .pl-sc { opacity: 0; transform: translateY(-40px); }
      .pl-glow { position: absolute; z-index: 1; width: 640px; height: 640px; filter: blur(57px); animation: pl-glow 2.2s cubic-bezier(0.2, 0.9, 0.25, 1.04) both; }
      .pl-glow.a { left: -300px; bottom: -300px; --fx: -1200px; background: radial-gradient(60% 91% at 50% 52%, var(--accent2) 0%, transparent 100%); }
      .pl-glow.b { right: -300px; top: -300px; --fx: 1200px; background: radial-gradient(60% 91% at 50% 52%, var(--accent) 0%, transparent 100%); }
      @keyframes pl-glow { from { transform: translateX(var(--fx)) scale(1.2); } to { transform: none; } }
      @media (max-width: 600px) {
        .pl-glow { width: 520px; height: 520px; }
        .pl-glow.a { left: -280px; bottom: -280px; }
        .pl-glow.b { right: -280px; top: -280px; }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font stylesheet: swaps in when loaded, system font until then. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      data-fonts
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    </noscript>
  </head>
  <body>
    <!--
      Static copy of the top of the hero, so there is something to read before the JavaScript has run.
      React replaces it on mount (the Hero skips its intro animation for these parts when data-shell is set).
      Keep the text and classes in step with src/sections/Hero.tsx and the person object in src/content.ts.
    -->
    <div id="preloader" class="preloader" aria-hidden="true">
      <div class="pl-glow a"></div>
      <div class="pl-glow b"></div>
      <div class="pl-text">
        <h1 class="pl-name">
          <span class="pl-ch" style="--i: 0">K</span><span class="pl-ch" style="--i: 1">E</span><span class="pl-ch" style="--i: 2">R</span><span class="pl-ch" style="--i: 3">V</span><span class="pl-ch" style="--i: 4">I</span><span class="pl-ch" style="--i: 5">N</span>
        </h1>
        <div class="pl-slogan"></div>
      </div>
    </div>
    <div id="root" data-shell>
      <!-- Same height as the sticky nav that React renders above the hero, so nothing jumps on mount. -->
      <div class="h-[60px] min-[1280px]:h-[66px]"></div>
      <section class="mx-auto flex min-h-[calc(100svh-5rem)] max-w-[1040px] flex-col items-center px-5 pb-10 pt-10 text-center md:pt-14">
        <div class="relative size-24">
          <img src="/avatar.png" alt="" width="96" height="96" fetchpriority="high" class="size-full rounded-full border border-border object-cover" />
        </div>
        <h1 class="mt-6 text-[clamp(32px,6vw,56px)] font-bold leading-[1.1] tracking-tight">
          <span class="mr-[0.28em] inline-block">Hi, I'm</span>
          <span class="name-grad"><span class="name-letter inline-block whitespace-nowrap">Kervin</span> <span class="name-letter inline-block whitespace-nowrap">Sarmiento</span></span>
        </h1>
        <p class="mt-3 max-w-xl text-lg text-muted">
          <span class="font-semibold text-text">Full-stack web developer.</span> I build web apps and desktop apps like Gabay, and I'm studying at USA.
        </p>
        <div class="mt-6 flex flex-wrap justify-center gap-3">
          <a href="#contact" class="inline-flex items-center justify-center gap-2 rounded-full bg-accent px-5 py-2 text-sm font-semibold text-accent-contrast">Hire me</a>
          <a href="#projects" class="inline-flex items-center justify-center gap-2 rounded-full border border-border px-5 py-2 text-sm font-semibold text-text">See my work</a>
        </div>
      </section>
    </div>
    <script src="/preloader.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
